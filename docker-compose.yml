services:
  backend:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: d-docker-web
    container_name: d-docker-web
    hostname: Docker-Web-GUI
    restart: always
    entrypoint: /src/docker-entrypoint.sh
    ports:
      - "8000:8000"
    environment:
      # Signs sessions and login tokens. Set it in .env (see .env.example); compose refuses to start without it.
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env, see .env.example}
      # Debug pages are off unless you set DJANGO_DEBUG=1 in .env.
      - DJANGO_DEBUG=${DJANGO_DEBUG:-0}
      # Host names the site answers to, comma-separated. * means any.
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
      - REDIS_URL=redis://redis:6379
      # Optional Google sign-in, off unless GOOGLE_CLIENT_ID is set (see .env.example).
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_ALLOWED_DOMAINS=${GOOGLE_ALLOWED_DOMAINS:-}
    # attach docker sock to interact with the host docker
    volumes:
      - ./src:/src
      - ./supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: d-docker-redis
