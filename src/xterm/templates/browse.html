{% extends 'base.html' %}
{% load static %}

{% block title %}Docker Hub{% endblock %}

{% block head %}{% include 'cdn/xterm.html' %}{% endblock %}

{% block content %}
<form id="searchForm" class="row g-3 mb-3 justify-content-center">
  <div class="col-sm-7 col-9">
    <input type="text" name="q" value="" class="form-control" placeholder="Search Images on Docker Hub">
  </div>
  <div class="col-sm-auto col-3">
    <button type="submit" class="btn btn-primary mb-3">Search</button>
  </div>
</form>
<div id="results"></div>

<div class="modal fade" id="imageModal" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" id="btn-close" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex">
          <div class="d-flex justify-content-center col-6 align-items-center row g-2">
            <div class="col-auto">
              <label for="modal_input" class="col-form-label">Image name: </label>
            </div>
            <div class="col-auto">
              <input id="modal_input" class="form-control" type="text" readonly />
            </div>
          </div>
          <div class="d-flex justify-content-center col-6 align-items-center row g-2">
            <div class="col-auto">
              <label for="modal_input_version" class="col-form-label">Version: </label>
            </div>
            <div class="col-auto">
              <input id="modal_input_version" class="form-control" type="text" placeholder="latest" />
            </div>
          </div>
        </div>

        <div class="d-flex mt-3 justify-content-center">
          <button id="pullImageBtn" class="btn btn-primary">Pull</button>
        </div>

        <div class="py-2 ps-2 pe-3 mt-3 d-none" style="background-color: black;" id="terminal"></div>
      </div>

      <div class="d-none mb-3 justify-content-evenly" id="modal_footer">
        <a href="/containers" class="btn btn-primary">Go To Containers</a>
        <a href="/images" class="btn btn-primary">Go To Images</a>
        <button data-bs-dismiss="modal" class="btn btn-primary">Continue browsing</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}<script src="{% static 'js/browse.js' %}"></script>{% endblock %}
