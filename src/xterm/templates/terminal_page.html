<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %}</title>
  {% include 'cdn/xterm.html' %}
  {% include 'cdn/sweetalert.html' %}
  {% load static %}
  <link rel="stylesheet" href="{% static 'styles/terminal.css' %}">
</head>
<body>
  <nav class="navbar">
    <span>Status: <span id="status">connecting...</span></span>
    <span id="console-info"></span>
  </nav>

  <div class="terminal-wrapper">
    <div id="terminal"></div>
  </div>

  <script src="{% static 'js/helper.js' %}"></script>
  <script src="{% static 'js/terminal-session.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
